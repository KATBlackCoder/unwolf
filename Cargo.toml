[workspace]
resolver = "3"
members = ["crates/unwolf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KATBlackCoder/unwolf"
readme = "README.md"
keywords = ["wolf-rpg", "dxarchive", "dxlib", "extract", "decrypt"]
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2.0"
encoding_rs = "0.8"
memmap2 = "0.9"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode"] }
